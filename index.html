<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚖️ محكمة الصحاب</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#263653 0%,#111827 35%,#05070d 100%);
    color:white;
    overflow-x:hidden;
}

button,input,textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.hidden{
    display:none!important;
}

/* ================= HEADER ================= */

header{
    padding:20px 15px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.1);
    background:rgba(0,0,0,.2);
    backdrop-filter:blur(12px);
}

.logo{
    font-size:42px;
    margin-bottom:5px;
}

header h1{
    font-size:28px;
}

header p{
    color:#aeb8cc;
    margin-top:7px;
}

/* ================= CONTAINER ================= */

.container{
    width:min(1050px,94%);
    margin:25px auto;
}

/* ================= CARDS ================= */

.card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    border-radius:22px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    backdrop-filter:blur(15px);
}

.card h2{
    margin-bottom:15px;
}

input,textarea{
    width:100%;
    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.15);
    color:white;
    padding:14px;
    border-radius:13px;
    outline:none;
    margin-bottom:12px;
}

textarea{
    min-height:130px;
    resize:vertical;
}

input:focus,textarea:focus{
    border-color:#6ea8ff;
}

/* ================= BUTTONS ================= */

.btn{
    padding:13px 20px;
    border-radius:13px;
    color:white;
    font-weight:bold;
    transition:.2s;
    margin:4px;
}

.btn:hover{
    transform:translateY(-2px);
}

.primary{
    background:linear-gradient(135deg,#3478ff,#6b4dff);
}

.green{
    background:linear-gradient(135deg,#00a86b,#00d084);
}

.red{
    background:linear-gradient(135deg,#d62939,#ff4b5c);
}

.yellow{
    background:linear-gradient(135deg,#d89500,#ffbf26);
    color:#111;
}

.gray{
    background:#374151;
}

/* ================= PLAYERS ================= */

.players{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.player{
    text-align:center;
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
}

.avatar{
    width:65px;
    height:65px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto auto 10px;
    border-radius:50%;
    background:linear-gradient(135deg,#315efb,#9b4dff);
    font-size:28px;
}

.player-name{
    font-weight:bold;
    font-size:18px;
}

.role{
    margin-top:7px;
    color:#9db4d9;
    font-size:14px;
}

.score{
    margin-top:8px;
    color:#ffd34d;
}

/* ================= COURT ================= */

.court{
    text-align:center;
}

.court-icon{
    font-size:65px;
}

.case-number{
    color:#9db4d9;
    margin-bottom:5px;
}

.case-title{
    font-size:25px;
    font-weight:bold;
    margin-bottom:20px;
}

.accusation{
    background:rgba(214,41,57,.12);
    border:1px solid rgba(255,75,92,.3);
    padding:18px;
    border-radius:17px;
    margin-bottom:20px;
    font-size:18px;
}

/* ================= TIMER ================= */

.timer{
    font-size:40px;
    font-weight:bold;
    color:#ffd34d;
    margin:15px;
}

/* ================= VERDICT ================= */

.verdict-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.verdict{
    padding:25px;
    border-radius:20px;
    font-size:22px;
    font-weight:bold;
    transition:.2s;
}

.verdict:hover{
    transform:scale(1.03);
}

/* ================= LEADERBOARD ================= */

.leader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    background:rgba(255,255,255,.05);
    border-radius:14px;
    margin:8px 0;
}

.rank{
    font-size:22px;
}

/* ================= STATUS ================= */

.status{
    position:fixed;
    left:15px;
    bottom:15px;
    background:#111827;
    border:1px solid rgba(255,255,255,.12);
    padding:10px 15px;
    border-radius:12px;
    font-size:13px;
    z-index:99;
}

.online{
    color:#31e981;
}

.offline{
    color:#ff5a67;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal-box{
    width:min(500px,100%);
    background:#111827;
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    padding:25px;
    text-align:center;
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){

    .players{
        grid-template-columns:1fr;
    }

    .verdict-box{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:23px;
    }

    .case-title{
        font-size:21px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">⚖️</div>
    <h1>محكمة الصحاب</h1>
    <p>يوسف × سيف × محمد</p>
</header>

<div class="container">

<!-- ================= LOBBY ================= -->

<section id="lobby">

    <div class="card">
        <h2>👤 اختار اسمك</h2>

        <input
            id="playerName"
            placeholder="اكتب اسمك"
            maxlength="20"
        >

        <button class="btn primary" onclick="createCourt()">
            🏛️ إنشاء محكمة
        </button>

        <button class="btn green" onclick="showJoin()">
            🔑 دخول لمحكمة
        </button>
    </div>

    <div id="joinBox" class="card hidden">

        <h2>🔑 دخول لمحكمة</h2>

        <input
            id="roomCode"
            placeholder="اكتب كود المحكمة"
            maxlength="8"
        >

        <button class="btn green" onclick="joinCourt()">
            دخول
        </button>

    </div>

</section>

<!-- ================= WAITING ================= -->

<section id="waiting" class="hidden">

    <div class="card court">

        <div class="court-icon">🏛️</div>

        <h2>المحكمة جاهزة</h2>

        <p style="margin:12px 0;color:#aeb8cc">
            ابعت الكود لأصحابك
        </p>

        <div
            id="displayCode"
            style="
            font-size:35px;
            font-weight:bold;
            letter-spacing:8px;
            color:#ffd34d;
            margin:20px;
            "
        ></div>

        <div class="players" id="waitingPlayers"></div>

        <button
            id="startButton"
            class="btn primary hidden"
            onclick="startGame()"
        >
            ⚖️ ابدأ المحكمة
        </button>

    </div>

</section>

<!-- ================= GAME ================= -->

<section id="game" class="hidden">

    <div class="card">

        <div class="players" id="gamePlayers"></div>

    </div>

    <div class="card court">

        <div class="court-icon">⚖️</div>

        <div class="case-number" id="caseNumber">
            القضية رقم 1
        </div>

        <div class="case-title" id="caseTitle">
            جاري تحميل القضية...
        </div>

        <div class="accusation" id="accusation"></div>

        <div class="timer" id="timer">
            60
        </div>

        <div id="roleArea"></div>

    </div>

</section>

<!-- ================= RESULTS ================= -->

<section id="results" class="hidden">

    <div class="card court">

        <div class="court-icon">🏆</div>

        <h2>نتيجة المحكمة</h2>

        <div id="leaderboard"></div>

        <button class="btn primary" onclick="newCase()">
            ⚖️ قضية جديدة
        </button>

    </div>

</section>

</div>

<div class="status">
    <span id="connectionDot" class="offline">●</span>
    <span id="connectionText">جاري الاتصال...</span>
</div>

<div id="modal" class="modal hidden">

    <div class="modal-box">

        <h2 id="modalTitle">⚖️ الحكم</h2>

        <p id="modalText" style="margin:15px 0;color:#c5cede"></p>

        <button class="btn primary" onclick="closeModal()">
            تمام
        </button>

    </div>

</div>

<!-- ================= FIREBASE ================= -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    get,
    update,
    onValue,
    push,
    remove,
    onDisconnect
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAhx23g8oBHK6rkFCOZy_ve8GqGcUfIYOg",
    authDomain: "friends--court.firebaseapp.com",
    projectId: "friends--court",
    storageBucket: "friends--court.firebasestorage.app",
    messagingSenderId: "286453720676",
    appId: "1:286453720676:web:919cbe92892435a29ee171",
    measurementId: "G-9359P5YR3V"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(
    app,
    "https://friends--court-default-rtdb.firebaseio.com/"
);


/* ================= GAME DATA ================= */

const CASES = [

    {
        title:"اختفاء غامض",
        text:"المتهم اختفى من الشات لفترة طويلة بدون أي تفسير."
    },

    {
        title:"جريمة التأخير",
        text:"المتهم قال أنا جاي وهو لسه في البيت."
    },

    {
        title:"سرقة الأكل",
        text:"المتهم أكل آخر قطعة من غير ما يسأل أصحابه."
    },

    {
        title:"الخيانة الكروية",
        text:"المتهم شجع فريقًا منافسًا أمام أصحابه."
    },

    {
        title:"الرسالة المتجاهلة",
        text:"المتهم شاف الرسالة ولم يرد عليها."
    },

    {
        title:"جريمة الاختفاء",
        text:"المتهم اختفى وقت ما أصحابه كانوا محتاجينه."
    },

    {
        title:"التهمة المجهولة",
        text:"المتهم متهم بأنه أكثر شخص يعمل مشاكل في المجموعة."
    },

    {
        title:"جريمة الضحك",
        text:"المتهم ضحك على صاحبه في موقف كان المفروض يساعده فيه."
    }

];


/* ================= STATE ================= */

let roomId = null;
let myId = null;
let myName = null;

let roomRef = null;
let roomData = null;

let timerInterval = null;


/* ================= HELPERS ================= */

function randomCode(){

    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for(let i=0;i<6;i++){
        code += chars[Math.floor(Math.random()*chars.length)];
    }

    return code;
}

function randomId(){

    return Math.random().toString(36).substring(2)
        + Date.now().toString(36);
}

function show(id){

    document.getElementById("lobby").classList.add("hidden");
    document.getElementById("waiting").classList.add("hidden");
    document.getElementById("game").classList.add("hidden");
    document.getElementById("results").classList.add("hidden");

    document.getElementById(id).classList.remove("hidden");
}

function escapeHtml(text){

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* ================= CONNECTION ================= */

const connectedRef = ref(db,".info/connected");

onValue(connectedRef,(snap)=>{

    const dot =
        document.getElementById("connectionDot");

    const text =
        document.getElementById("connectionText");

    if(snap.val() === true){

        dot.className = "online";
        text.textContent = "متصل";

    }else{

        dot.className = "offline";
        text.textContent = "غير متصل";

    }

});


/* ================= CREATE COURT ================= */

window.createCourt = async function(){

    myName =
        document.getElementById("playerName")
        .value.trim();

    if(!myName){

        alert("اكتب اسمك الأول");

        return;
    }

    myId = randomId();

    roomId = randomCode();

    roomRef = ref(db,"rooms/"+roomId);

    const player = {

        id:myId,
        name:myName,
        score:0,
        online:true

    };

    await set(roomRef,{

        code:roomId,

        host:myId,

        status:"waiting",

        round:0,

        currentCase:null,

        players:{
            [myId]:player
        }

    });

    onDisconnect(
        ref(db,"rooms/"+roomId+"/players/"+myId+"/online")
    ).set(false);

    document.getElementById("displayCode")
        .textContent = roomId;

    show("waiting");

    listenRoom();

};


/* ================= JOIN ================= */

window.showJoin = function(){

    document.getElementById("joinBox")
        .classList.remove("hidden");

};


window.joinCourt = async function(){

    myName =
        document.getElementById("playerName")
        .value.trim();

    const code =
        document.getElementById("roomCode")
        .value.trim()
        .toUpperCase();

    if(!myName){

        alert("اكتب اسمك");

        return;
    }

    if(!code){

        alert("اكتب كود المحكمة");

        return;
    }

    const target =
        ref(db,"rooms/"+code);

    const snap =
        await get(target);

    if(!snap.exists()){

        alert("المحكمة غير موجودة");

        return;
    }

    const data = snap.val();

    if(
        data.players &&
        Object.keys(data.players).length >= 3
    ){

        alert("المحكمة مكتملة");

        return;
    }

    myId = randomId();

    roomId = code;

    roomRef = target;

    await update(
        ref(db,"rooms/"+roomId+"/players/"+myId),
        {
            id:myId,
            name:myName,
            score:0,
            online:true
        }
    );

    onDisconnect(
        ref(db,"rooms/"+roomId+"/players/"+myId+"/online")
    ).set(false);

    show("waiting");

    document.getElementById("displayCode")
        .textContent = roomId;

    listenRoom();

};


/* ================= LISTEN ================= */

function listenRoom(){

    onValue(roomRef,(snap)=>{

        if(!snap.exists()) return;

        roomData = snap.val();

        renderWaiting();

        if(roomData.status === "playing"){

            show("game");

            renderGame();

        }

        if(roomData.status === "results"){

            show("results");

            renderResults();

        }

    });

}


/* ================= WAITING ================= */

function renderWaiting(){

    if(!roomData || !roomData.players)
        return;

    const players =
        Object.values(roomData.players);

    const box =
        document.getElementById("waitingPlayers");

    box.innerHTML = "";

    players.forEach((p,index)=>{

        box.innerHTML += `

        <div class="player">

            <div class="avatar">
                ${index===0?"👑":"👤"}
            </div>

            <div class="player-name">
                ${escapeHtml(p.name)}
            </div>

            <div class="role">
                ${index===0?"صاحب المحكمة":"لاعب"}
            </div>

        </div>

        `;

    });

    const start =
        document.getElementById("startButton");

    if(
        roomData.host === myId &&
        players.length === 3
    ){

        start.classList.remove("hidden");

    }else{

        start.classList.add("hidden");

    }

}


/* ================= START ================= */

window.startGame = async function(){

    if(!roomData || roomData.host !== myId)
        return;

    const players =
        Object.values(roomData.players);

    if(players.length !== 3){

        alert("لازم يكون فيه 3 لاعبين");

        return;
    }

    await update(roomRef,{

        status:"playing",

        round:1,

        currentCase:Math.floor(
            Math.random()*CASES.length
        ),

        caseStart:Date.now(),

        judgeIndex:0

    });

};


/* ================= ROLES ================= */

function getRoles(){

    const players =
        Object.values(roomData.players);

    const judgeIndex =
        roomData.judgeIndex || 0;

    const judge =
        players[judgeIndex % players.length];

    const accused =
        players[(judgeIndex+1) % players.length];

    const prosecutor =
        players[(judgeIndex+2) % players.length];

    return {
        players,
        judge,
        accused,
        prosecutor
    };

}


/* ================= GAME ================= */

function renderGame(){

    if(!roomData) return;

    const roles = getRoles();

    document.getElementById("caseNumber")
        .textContent =
        "القضية رقم "+roomData.round;

    const c =
        CASES[roomData.currentCase];

    document.getElementById("caseTitle")
        .textContent = c.title;

    document.getElementById("accusation")
        .textContent = c.text;

    renderGamePlayers(roles);

    renderRoleArea(roles);

    startTimer();

}


function renderGamePlayers(roles){

    const box =
        document.getElementById("gamePlayers");

    box.innerHTML = "";

    roles.players.forEach(p=>{

        let role = "لاعب";

        if(p.id === roles.judge.id)
            role = "👨‍⚖️ القاضي";

        if(p.id === roles.accused.id)
            role = "🚨 المتهم";

        if(p.id === roles.prosecutor.id)
            role = "📢 المدعي";

        box.innerHTML += `

        <div class="player">

            <div class="avatar">👤</div>

            <div class="player-name">
                ${escapeHtml(p.name)}
            </div>

            <div class="role">
                ${role}
            </div>

            <div class="score">
                ⭐ ${p.score || 0}
            </div>

        </div>

        `;

    });

}


/* ================= ROLE AREA ================= */

function renderRoleArea(roles){

    const area =
        document.getElementById("roleArea");

    area.innerHTML = "";

    if(myId === roles.accused.id){

        area.innerHTML = `

        <h3>🚨 أنت المتهم</h3>

        <p style="margin:10px 0;color:#adb9cc">
            اكتب دفاعك أمام المحكمة
        </p>

        <textarea
            id="defense"
            placeholder="اكتب دفاعك هنا..."
        ></textarea>

        <button
            class="btn primary"
            onclick="submitDefense()"
        >
            📝 تقديم الدفاع
        </button>

        `;

    }

    else if(myId === roles.prosecutor.id){

        area.innerHTML = `

        <h3>📢 أنت المدعي</h3>

        <p style="margin:10px 0;color:#adb9cc">
            اكتب حجتك ضد المتهم
        </p>

        <textarea
            id="prosecution"
            placeholder="اكتب حجتك هنا..."
        ></textarea>

        <button
            class="btn red"
            onclick="submitProsecution()"
        >
            📢 تقديم الاتهام
        </button>

        `;

    }

    else if(myId === roles.judge.id){

        area.innerHTML = `

        <h3>👨‍⚖️ أنت القاضي</h3>

        <p style="margin:10px 0;color:#adb9cc">
            استمع للدفاع والاتهام ثم أصدر الحكم
        </p>

        <div id="arguments"
             style="margin:15px 0">
        </div>

        <div class="verdict-box">

            <button
                class="verdict green"
                onclick="makeVerdict('innocent')"
            >
                🟢 براءة
            </button>

            <button
                class="verdict red"
                onclick="makeVerdict('guilty')"
            >
                🔴 مذنب
            </button>

        </div>

        `;

        loadArguments();

    }

    else{

        area.innerHTML = `

        <h3>👀 شاهد المحكمة</h3>

        <p style="color:#adb9cc;margin-top:10px">
            انتظر قرار القاضي...
        </p>

        `;

    }

}


/* ================= ARGUMENTS ================= */

async function submitDefense(){

    const text =
        document.getElementById("defense")
        ?.value.trim();

    if(!text){

        alert("اكتب دفاعك");

        return;
    }

    await set(
        ref(
            db,
            "rooms/"+roomId+
            "/arguments/defense"
        ),
        {
            player:myName,
            text:text
        }
    );

    alert("تم تقديم الدفاع ⚖️");

}


window.submitDefense = submitDefense;


async function submitProsecution(){

    const text =
        document.getElementById("prosecution")
        ?.value.trim();

    if(!text){

        alert("اكتب الاتهام");

        return;
    }

    await set(
        ref(
            db,
            "rooms/"+roomId+
            "/arguments/prosecution"
        ),
        {
            player:myName,
            text:text
        }
    );

    alert("تم تقديم الاتهام 📢");

}


window.submitProsecution = submitProsecution;


/* ================= LOAD ARGUMENTS ================= */

async function loadArguments(){

    const snap =
        await get(
            ref(
                db,
                "rooms/"+roomId+"/arguments"
            )
        );

    const box =
        document.getElementById("arguments");

    if(!box) return;

    if(!snap.exists()){

        box.innerHTML =
            "<p style='color:#8d99ad'>لم يقدم أحد حجته بعد...</p>";

        return;
    }

    const data = snap.val();

    box.innerHTML = "";

    if(data.prosecution){

        box.innerHTML += `

        <div class="card">
            <b>📢 الاتهام</b>
            <p style="margin-top:10px">
                ${escapeHtml(data.prosecution.text)}
            </p>
        </div>

        `;

    }

    if(data.defense){

        box.innerHTML += `

        <div class="card">
            <b>🛡️ الدفاع</b>
            <p style="margin-top:10px">
                ${escapeHtml(data.defense.text)}
            </p>
        </div>

        `;

    }

}


/* ================= VERDICT ================= */

window.makeVerdict = async function(verdict){

    if(myId !== getRoles().judge.id)
        return;

    const roles = getRoles();

    let updates = {};

    if(verdict === "guilty"){

        updates[
            "players/"+roles.accused.id+"/score"
        ] =
        (roles.players.find(
            p=>p.id===roles.accused.id
        ).score || 0) - 10;

        updates[
            "players/"+roles.prosecutor.id+"/score"
        ] =
        (roles.players.find(
            p=>p.id===roles.prosecutor.id
        ).score || 0) + 15;

        updates[
            "players/"+roles.judge.id+"/score"
        ] =
        (roles.players.find(
            p=>p.id===roles.judge.id
        ).score || 0) + 10;

    }else{

        updates[
            "players/"+roles.accused.id+"/score"
        ] =
        (roles.players.find(
            p=>p.id===roles.accused.id
        ).score || 0) + 15;

        updates[
            "players/"+roles.judge.id+"/score"
        ] =
        (roles.players.find(
            p=>p.id===roles.judge.id
        ).score || 0) + 10;

    }

    updates.verdict = verdict;

    updates.status = "results";

    await update(roomRef,updates);

};


/* ================= RESULTS ================= */

function renderResults(){

    const box =
        document.getElementById("leaderboard");

    const players =
        Object.values(roomData.players)
        .sort(
            (a,b)=>
            (b.score||0)-(a.score||0)
        );

    box.innerHTML = "";

    players.forEach((p,index)=>{

        const medals = ["🥇","🥈","🥉"];

        box.innerHTML += `

        <div class="leader">

            <span>
                <span class="rank">
                    ${medals[index] || "🏅"}
                </span>
                ${escapeHtml(p.name)}
            </span>

            <strong>
                ⭐ ${p.score || 0}
            </strong>

        </div>

        `;

    });

}


/* ================= NEW CASE ================= */

window.newCase = async function(){

    if(roomData.host !== myId)
        return;

    const players =
        Object.values(roomData.players);

    const newRound =
        (roomData.round || 0)+1;

    const newJudge =
        ((roomData.judgeIndex || 0)+1)
        % players.length;

    await update(roomRef,{

        status:"playing",

        round:newRound,

        currentCase:
            Math.floor(Math.random()*CASES.length),

        caseStart:Date.now(),

        judgeIndex:newJudge,

        arguments:null,

        verdict:null

    });

};


/* ================= TIMER ================= */

function startTimer(){

    clearInterval(timerInterval);

    const timer =
        document.getElementById("timer");

    function updateTimer(){

        if(!roomData?.caseStart){

            timer.textContent = 60;

            return;
        }

        const elapsed =
            Math.floor(
                (Date.now()-roomData.caseStart)/1000
            );

        const remaining =
            Math.max(0,60-elapsed);

        timer.textContent =
            remaining;

        if(remaining <= 0){

            clearInterval(timerInterval);

        }

    }

    updateTimer();

    timerInterval =
        setInterval(updateTimer,1000);

}


/* ================= MODAL ================= */

window.closeModal = function(){

    document.getElementById("modal")
        .classList.add("hidden");

};

</script>
